<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glove Chords</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --card: #1d212a; --line: #2a2f3a; --text: #e6e8ec; --muted: #8b93a3;
    --accent: #4fd18b; --warn: #e5a14d;
    --thumb: #ff7a59; --index: #f5c542; --middle: #4fd18b; --ring: #4aa8ff; --little: #b07cff;
  }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 330px minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 20px 0 20px 20px; display: flex; flex-direction: column; gap: 10px; }
  .side .panel { padding: 12px; flex: none; }
  .side h2 { margin-bottom: 8px; }
  .side .simbox { display: flex; flex-direction: column; height: 186px; }
  .side .vizbox { flex: 1; min-height: 50px; display: flex; }
  .canvasbox { position: relative; flex: 1; min-height: 0; }
  .canvasbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .wrap { padding: 20px 20px 20px 16px; min-width: 0; min-height: 100vh; display: flex; flex-direction: column; gap: 16px; justify-content: space-between; }
  .wrap > * { flex: none; transition: opacity .2s; }
  .wrap.locked > * { opacity: .45; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .side { position: static; height: auto; padding: 20px 20px 0; }
    .wrap { min-height: 0; }
  }
  .top { display: flex; flex-direction: column; gap: 8px; }
  .top .titlerow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .top select { flex: 1; min-width: 0; }
  .top label.inline span { width: 40px; }
  h1 { font-size: 17px; margin: 0; white-space: nowrap; }
  button.primary { padding: 6px 22px; }
  label.inline { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  select, button { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; font: inherit; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #08130d; border-color: var(--accent); font-weight: 600; }
  button.primary.on { background: var(--card); color: var(--accent); }
  .conn { color: var(--muted); font-size: 12px; padding-left: 4px; }
  .conn .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e5484d; margin-right: 7px; }
  .conn .live .dot { background: var(--accent); }

  .now { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px; display: flex; align-items: center; gap: 24px; }
  .now .label { flex: none; min-width: 150px; text-align: left; }
  .now .roman { font-size: 52px; font-weight: 700; line-height: 1; letter-spacing: -.02em; white-space: nowrap; }
  .now .name { font-size: 20px; margin-top: 8px; color: var(--muted); white-space: nowrap; }
  .now.idle .roman { color: #3a404d; }
  .now.idle .label { text-align: center; }
  #piano { flex: 1; min-width: 0; position: relative; height: clamp(130px, 21vh, 210px); }
  #piano svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #piano .wk { fill: var(--muted); }
  #piano .bk { fill: #12141a; }
  #piano .wk.on { fill: var(--accent); }
  #piano .bk.on { fill: #2fa868; stroke: var(--accent); stroke-width: .8; }
  @media (max-width: 620px) { .now { flex-direction: column; align-items: stretch; } }

  .chords { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; flex: 1; }
  .wrap > #rhBox { flex: 1; display: flex; flex-direction: column; }
  @media (max-width: 680px) { .chords { grid-template-columns: repeat(4, 1fr); } }
  .chord { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 6px 12px; text-align: center; cursor: pointer; user-select: none; display: flex; flex-direction: column; justify-content: center; transition: background .06s, border-color .06s; }
  .chord .r { font-size: 30px; line-height: 1.2; font-weight: 700; }
  .chord .n { font-size: 15px; color: var(--muted); }
  .chord .who { margin-top: 8px; min-height: 51px; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; }
  svg.hand { display: block; flex: none; }
  .chord.active { background: #1f3a2c; border-color: var(--accent); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 780px) { .grid2 { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .frow { display: grid; grid-template-columns: 66px 1fr 40px; align-items: center; gap: 8px; margin: 2px 0; }
  .bar { position: relative; height: 12px; background: #232733; border-radius: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; }
  .bar .th { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff6; left: 50%; }
  .val { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .val.down { color: var(--text); font-weight: 600; }
  .btns { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .btns button { padding: 5px 8px; font-size: 13px; }
  .help { color: var(--muted); font-size: 12px; margin-top: 12px; }
  .controls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; flex: 1; }
  @media (max-width: 1150px) { .controls { grid-template-columns: repeat(2, 1fr); } }
  .ctl { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; position: relative; }
  .ctl.active { border-color: var(--accent); background: #1f3a2c; }
  .ctlhead { display: flex; align-items: center; min-height: 30px; }
  .ctl .hands { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; gap: 2px; pointer-events: none; }
  .ctl:not(.wide) .opts { padding-right: 50px; }     /* keep the option highlight clear of the hand */
  .cname { font-size: 15px; font-weight: 700; }
  .ends .cval { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meterwrap { display: flex; gap: 8px; flex: 1; min-height: 150px; }
  .meter { position: relative; width: 34px; background: #232733; border-radius: 6px; overflow: hidden; cursor: pointer; touch-action: none; }
  .meter > i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--muted); }
  .ctl.active .meter > i { background: var(--accent); }
  .meter > b { position: absolute; left: 0; right: 0; height: 2px; background: #fff; display: none; }
  .ctl.active .meter > b { display: block; }
  .ends { flex: 1; display: flex; flex-direction: column; justify-content: space-between; color: var(--muted); font-size: 11px; }
  .opts { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .opt { border: 1px solid transparent; border-radius: 6px; padding: 4px 7px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
  .opt.sel { color: var(--text); background: #2a2f3a; font-weight: 600; }
  .opt.hover { border-color: var(--accent); color: var(--text); }
  .opt.na { opacity: .35; text-decoration: line-through; }
  .sus { display: flex; flex-direction: row; gap: 4px; }
  .sus .opt { flex: 1; text-align: center; padding: 4px 2px; }
  .ctl .hint { font-size: 11px; color: var(--muted); min-height: 16px; }
  .ctl.active .hint { color: var(--accent); }
  .handname { font-size: 12px; color: var(--muted); margin: 10px 0 2px; }
  .handname:first-child { margin-top: 0; }
  kbd { background: var(--card); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 11px; }
</style>
</head>

<div class="app">
  <aside class="side">
    <div class="panel top">
      <div class="titlerow"><h1>Glove Chords</h1><button class="primary" id="audioBtn">Start</button></div>
      <label class="inline"><span>Key</span><select id="root"></select></label>
      <label class="inline"><span>Scale</span><select id="scale"></select></label>
    </div>
    <div class="panel vizbox"><div class="canvasbox"><canvas id="viz"></canvas></div></div>
    <div class="panel simbox">
      <h2>Simulated hands</h2>
      <div class="canvasbox"><canvas id="sim"></canvas></div>
    </div>
    <div class="panel">
      <h2>Detected input</h2>
      <div id="fingers"></div>
      <div class="btns">
        <button id="calOpen">Calibrate open hands</button>
        <button id="calFist">Calibrate fists</button>
      </div>
    </div>
    <div class="conn">
      <div id="connright"><span class="dot"></span>Right hand: <span>Disconnected</span></div>
      <div id="connleft"><span class="dot"></span>Left hand: <span>Disconnected</span></div>

  <main class="wrap locked" id="main">

      <div class="label">
        <div class="roman" id="nowRoman">–</div>
        <div class="name" id="nowName">&nbsp;</div>

      <div id="piano"></div>

    <div class="panel" id="rhBox">
      <h2>Right hand</h2>

      <div class="controls" id="controls"></div>
    </div>
  </main>
</div>

<!-- Music theory: pure functions, no DOM. -->
<script>
"use strict";
const SHARPS = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const FLATS  = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
const ROOTS  = ["C","Db","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
const SCALES = {
  "Major (Ionian)":  [0,2,4,5,7,9,11],
  "Natural minor":   [0,2,3,5,7,8,10],
  "Harmonic minor":  [0,2,3,5,7,8,11],
  "Dorian":          [0,2,3,5,7,9,10],
  "Phrygian":        [0,1,3,5,7,8,10],
  "Lydian":          [0,2,4,6,7,9,11],
  "Mixolydian":      [0,2,4,5,7,9,10],
};
const ROMAN = ["I","II","III","IV","V","VI","VII"];

// Chord quality from semitone intervals above the root: [third, fifth, (seventh)].
const QUALITIES = {
  "4,7":    { suffix: "",     roman: r => r,                    word: "major" },
  "3,7":    { suffix: "m",    roman: r => r.toLowerCase(),      word: "minor" },
  "3,6":    { suffix: "dim",  roman: r => r.toLowerCase() + "°", word: "diminished" },
  "4,8":    { suffix: "aug",  roman: r => r + "+",              word: "augmented" },
  "4,7,11": { suffix: "maj7", roman: r => r + "maj7",           word: "major 7th" },
  "4,7,10": { suffix: "7",    roman: r => r + "7",              word: "dominant 7th" },
  "3,7,10": { suffix: "m7",   roman: r => r.toLowerCase() + "7", word: "minor 7th" },
  "3,6,10": { suffix: "m7b5", roman: r => r.toLowerCase() + "ø7", word: "half-diminished 7th" },
  "3,6,9":  { suffix: "dim7", roman: r => r.toLowerCase() + "°7", word: "diminished 7th" },
  "3,7,11": { suffix: "mMaj7",roman: r => r.toLowerCase() + "maj7", word: "minor-major 7th" },
  "4,8,11": { suffix: "+maj7",roman: r => r + "+maj7",          word: "augmented major 7th" },
};

function useFlats(rootName, scaleName) {
  if (rootName.includes("b") || rootName === "F") return true;
  const minorish = /minor|Dorian|Phrygian/.test(scaleName);
  return minorish && ["C", "D", "G"].includes(rootName);
}

const VARIATIONS = [
  { id: "9", label: "9th" }, { id: "7", label: "7th" }, { id: "triad", label: "Triad" },
  { id: "6", label: "6th" }, { id: "add9", label: "Add 9" },
];
/** sus2 doubles the 9th, so it is not offered on the 9th variations. */
const susAllowed = (variation, sus) => !(sus === 2 && (variation === "9" || variation === "add9"));

/**
 * Chord on scale degree `deg` (0-based). The third, fifth, 6th, 7th and 9th are diatonic (stacked from
 * the scale); sus2 / sus4 replace the third with a major 2nd / perfect 4th above the root.
 * `midi` is in close position with the tonic around C3; the synth moves it to each instrument's register.
 */
function buildChord(rootName, scaleName, deg, variation = "triad", sus = 0) {
  const scale = SCALES[scaleName];
  const names = useFlats(rootName, scaleName) ? FLATS : SHARPS;
  const base = 48 + ROOTS.indexOf(rootName);
  const tone = k => { const idx = deg + k; return base + scale[idx % 7] + 12 * Math.floor(idx / 7); };
  const r = tone(0), T = tone(2) - r, F = tone(4) - r, X = tone(5) - r, Sv = tone(6) - r, N = tone(8) - r;
  if (!susAllowed(variation, sus)) sus = 0;
  const third = sus === 2 ? 2 : sus === 4 ? 5 : T;
  const iv = [0, third, F];
  if (variation === "6") iv.push(X);
  if (variation === "7" || variation === "9") iv.push(Sv);
  if (variation === "9" || variation === "add9") iv.push(N);
  const midi = iv.map(i => r + i);

  const other = { suffix: "?", roman: x => x + "?", word: "other" };
  const tq = QUALITIES[`${T},${F}`] || other, sq = QUALITIES[`${T},${F},${Sv}`] || other;
  const R = ROMAN[deg % 7], flat9 = N !== 14, flat6 = X !== 9;
  let suffix, roman, word;
  if (sus) {
    const ext = { triad: "", "7": Sv === 11 ? "maj7" : "7", "9": (Sv === 11 ? "maj9" : "9") + (flat9 ? "(b9)" : ""),
                  "6": flat6 ? "(b6)" : "6", add9: "" }[variation];
    suffix = ext + "sus" + sus + (variation === "add9" ? (flat9 ? "add(b9)" : "add9") : "") + (F === 6 ? "(b5)" : F === 8 ? "(#5)" : "");
    roman = R + suffix;
    word = `suspended ${sus === 2 ? "2nd" : "4th"}` + (variation === "triad" ? "" : `, ${VARIATIONS.find(v => v.id === variation).label.toLowerCase()}`);
  } else if (variation === "7") {
    suffix = sq.suffix; roman = sq.roman(R); word = sq.word;
  } else if (variation === "9") {
    suffix = flat9 ? sq.suffix + "(b9)" : sq.suffix.replace("7", "9");
    roman = flat9 ? sq.roman(R) + "(b9)" : sq.roman(R).replace("7", "9");
    word = flat9 ? sq.word + ", flat 9th" : sq.word.replace("7th", "9th");
  } else if (variation === "6") {
    const x = flat6 ? "(b6)" : "6";
    suffix = tq.suffix + x; roman = tq.roman(R) + x; word = tq.word + (flat6 ? " flat 6th" : " 6th");
  } else if (variation === "add9") {
    const x = flat9 ? "add(b9)" : "add9";
    suffix = tq.suffix + x; roman = tq.roman(R) + x; word = tq.word + (flat9 ? " add flat 9" : " add 9");
  } else {
    suffix = tq.suffix; roman = tq.roman(R); word = tq.word;
  }
  const chordRoot = names[r % 12];
  const up = deg >= 7;                           // degree 8 = degree 1 an octave up
  return {
    degree: deg + 1,
    roman: roman + (up ? "↑" : ""),
    name: chordRoot + suffix,
    word: `${chordRoot} ${word}${up ? " (octave up)" : ""}`,
    notes: midi.map(m => names[m % 12]),
    midi, third, fifth: F,
  };
}
</script>

<!-- App -->
<script>
"use strict";
const FINGERS = [
  { id: "thumb_finger_sensor",  label: "Thumb",  color: "--thumb" },
  { id: "index_finger_sensor",  label: "Index",  color: "--index" },
  { id: "middle_finger_sensor", label: "Middle", color: "--middle" },
  { id: "ring_finger_sensor",   label: "Ring",   color: "--ring" },
  { id: "little_finger_sensor", label: "Little", color: "--little" },
];
const css = getComputedStyle(document.documentElement);
FINGERS.forEach(f => f.hex = css.getPropertyValue(f.color).trim());
const $ = id => document.getElementById(id);

// ── Settings (persisted per browser) ──────────────────────────────────────
const CAL0 = () => ({ open: [20, 20, 20, 20, 20], fist: [100, 100, 100, 100, 100] });
const DEFAULTS = {
  root: "C", scale: "Major (Ionian)",
  countMap: [1, 2, 3, 4, 5],        // right hand: 1..5 extended fingers -> degree
  comboMap: {},                     // combo id -> degree (overrides the combo's default; 0 = stop)
  cal: { right: CAL0(), left: CAL0() },
  volume: 0.7, tempo: 100, pattern: "sustain", instrument: "mix", variation: "triad", sus: 0, span: 2,
  swap: false, invTilt: false, invRoll: false,
};
let S = DEFAULTS;
try { S = { ...DEFAULTS, ...JSON.parse(localStorage.getItem("gloveChords") || "{}") }; } catch {}
if (S.cal.open) S.cal = { right: S.cal, left: CAL0() };          // older single-glove calibration
const save = () => { try { localStorage.setItem("gloveChords", JSON.stringify(S)); } catch {} };

// ── Left-hand settings ────────────────────────────────────────────────────
// Lists are written top to bottom, the way they appear on screen (tilt up = move towards the top).
const PATTERNS = [
  { id: "down", label: "Arpeggio down" }, { id: "up", label: "Arpeggio up" }, { id: "updown", label: "Arpeggio up-down" },
  { id: "sustain", label: "Sustain" }, { id: "pulse", label: "Pulse" }, { id: "broken", label: "Broken chord" },
];
const INSTRUMENTS = [
  { id: "strings", label: "Strings + Strings", lower: "strings", upper: "strings" },
  { id: "mix",     label: "Strings low + Piano high", lower: "strings", upper: "piano" },
  { id: "piano",   label: "Piano + Piano", lower: "piano", upper: "piano" },
];
// Index = finger count - 1. `perDeg`: change per degree of hand tilt.
const CONTROLS = [
  { key: "volume", label: "Volume", type: "range", min: 0, max: 1, perDeg: 1 / 60, fmt: v => Math.round(v * 100) + "%", ends: ["Louder", "Quieter"] },
  { key: "tempo", label: "Tempo", type: "range", min: 40, max: 200, perDeg: 160 / 60, fmt: v => Math.round(v) + " bpm", ends: ["Faster", "Slower"] },
  { key: "pattern", label: "Pattern", type: "list", options: PATTERNS,
    twist: { key: "span", left: 1, centre: 2, right: 3, labels: ["‹ 1 oct", "2 oct", "3 oct ›"] } },
  { key: "instrument", label: "Sound", type: "list", options: INSTRUMENTS },
  { key: "variation", label: "Variation", type: "list", options: VARIATIONS,
    twist: { key: "sus", left: 2, centre: 0, right: 4, labels: ["‹ Sus2", "Normal", "Sus4 ›"] } },
];
// `twist`: a second choice made by rotating the wrist while the menu is open (centred = `centre`).
const ARPS = ["down", "up", "updown"];   // patterns that use the octave span
const STEP_DEG = 14;                  // hand tilt per list step
let menu = null;                      // open setting: { i, key, hover, pose0, hist, matching }
let ctlDirty = true;
/** What the open menu is pointing at for setting `k` (the saved value if it isn't open). */
const hov = k => (menu && k in menu.hover) ? menu.hover[k] : S[k];
/** Setting value in effect. Volume and tempo are heard while you move; everything else only changes on the fist. */
const LIVE_PREVIEW = ["volume", "tempo"];
const eff = k => LIVE_PREVIEW.includes(k) ? hov(k) : S[k];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const chordFor = deg => buildChord(S.root, S.scale, deg - 1, eff("variation"), eff("sus"));

// ── Synth (Web Audio) ─────────────────────────────────────────────────────
let actx = null, master = null, pianoWave = null, pianoHiWave = null, noiseBuf = null;
const partBus = {};                   // "lower" / "upper" -> { bus, an } (analyser for the visualiser)
const reverbSend = {};                // instrument -> gain node feeding the reverb
const masterGain = () => { const v = eff("volume"); return v * v * 0.45; };
function startAudio() {
  if (actx) { actx.resume(); return; }
  actx = new AudioContext();
  // Output: volume -> gentle compressor -> soft clipper, so loud chords round off instead of crackling.
  const comp = actx.createDynamicsCompressor();
  comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 6; comp.attack.value = 0.005; comp.release.value = 0.2;
  const soft = actx.createWaveShaper();
  soft.curve = Float32Array.from({ length: 1025 }, (_, i) => Math.tanh((i - 512) / 512 * 1.5) / Math.tanh(1.5) * 0.95);
  soft.oversample = "2x";
  master = actx.createGain(); master.gain.value = masterGain();
  master.connect(comp).connect(soft).connect(actx.destination);
  for (const part of ["lower", "upper"]) {
    const bus = actx.createGain(), an = actx.createAnalyser();
    an.fftSize = 4096; an.smoothingTimeConstant = 0.82; an.minDecibels = -78; an.maxDecibels = -12;
    bus.connect(master); bus.connect(an);
    partBus[part] = { bus, an, bins: new Uint8Array(an.frequencyBinCount) };
  }

  // Room: a generated impulse response (2.6 s of decaying, progressively darker noise).
  const sr = actx.sampleRate, len = Math.floor(sr * 2.6), ir = actx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    let y = 0;
    for (let i = Math.floor(sr * 0.012); i < len; i++) {
      const x = (Math.random() * 2 - 1) * Math.exp(-4.2 * i / len);
      y += (x - y) * (0.5 - 0.35 * i / len);
      d[i] = y;
    }
  }
  const reverb = actx.createConvolver(); reverb.buffer = ir; reverb.connect(master);
  for (const [inst, amount] of [["piano", 0.5], ["strings", 0.3]]) {
    reverbSend[inst] = actx.createGain(); reverbSend[inst].gain.value = amount; reverbSend[inst].connect(reverb);
  }

  // Piano string spectrum, and its upper partials on their own (they are tuned sharp and die first).

    HANDS.forEach(h => { const r = rawAngles(h); if (r && r.every(a => a != null)) samples[h].push(r); });
  }, 20);
  setTimeout(() => {

    if (detail) {
      for (const t of [0.42, 0.72]) out += `<path d="M${pt(t, wAt(t) - 1)} L${pt(t, 1 - wAt(t))}" stroke="#000" stroke-opacity=".22" stroke-width="1.2" stroke-linecap="round"/>`;
      out += `<path d="M${pt(0.9, r1 - 2)} L${pt(1.02, r1 - 2.4)} L${pt(1.02, 2.4 - r1)} L${pt(0.9, 2 - r1)}Z" fill="#fff" fill-opacity=".38" stroke="#fff" stroke-opacity=".38" stroke-width="1.6" stroke-linejoin="round"/>`;
    }
    return out;
  };
  let curled = "", extended = "";
  FINGER_GEOM.forEach((g, i) => {
    const color = FINGERS[i].hex;
    if (up[i]) extended += finger(g.base, g.tip, g.w[0], g.w[1], color, 1, true);
    else if (g.fold) curled += finger(g.base, g.fold, g.w[0], g.w[1], color, 0.7, false);            // thumb tucked over the palm
    else curled += finger([g.base[0], g.base[1] - 5], [g.base[0], g.base[1] + 9], g.w[0], g.w[0] - 1, color, 0.7, false);   // folded: just the knuckle
  });
  // Palm: wide at the knuckles, a bulge under the thumb, narrowing into the wrist.
  const palm = `<path d="M30 60 Q30 51 38 51 L66 50 Q79 52 80 63 L78 88 Q77 97 70 100 L70 108 L42 108 L42 101 Q30 97 29 84 Z" fill="#2a2f3a" stroke="#454c5b" stroke-width="2" stroke-linejoin="round"/>`;
  return `<svg class="hand" width="${size}" height="${size * 1.1}" viewBox="0 0 100 110" role="img" aria-label="${title}">` +
    (title ? `<title>${title}</title>` : "") +
    `<g${mirror ? ' transform="translate(100,0) scale(-1,1)"' : ""}>` + extended + palm + curled + `</g></svg>`;
}
const upOnly = upIdx => [0, 1, 2, 3, 4].map(i => upIdx.includes(i));
const names = idx => idx.map(i => FINGERS[i].label).join(" + ");

/** Every right-hand gesture that plays `deg`, as [{up, title}]. */
function gesturesFor(deg) {
  return [
    ...S.countMap.map((d, i) => d === deg ? { up: upOnly([0, 1, 2, 3, 4].slice(0, i + 1)), title: `${COUNT_LABELS[i]} up` } : null).filter(Boolean),
    ...[...COUNT_COMBOS, FIST].filter(c => comboDeg(c) === deg).map(c => ({ up: upOnly(c.fingers), title: c === FIST ? "Fist" : `${names(c.fingers)} up` })),
  ];
}
function whoPlays(deg) {
  return gesturesFor(deg).map(g => handSVG(g.up, 46, g.title)).join("");
}

function renderChords() {
  $("chords").innerHTML = [1, 2, 3, 4, 5, 6, 7, 8].map(d => {
    const ch = chordFor(d);
    return `<div class="chord" data-deg="${d}"><div class="r">${ch.roman}</div><div class="n">${ch.name}</div><div class="who">${whoPlays(d)}</div></div>`;
  }).join("");
  document.querySelectorAll(".chord").forEach(el => {
    el.onpointerdown = () => { if (actx) play(+el.dataset.deg, "ui"); };
    el.onpointerleave = () => stop("ui");
  });
  if (current) renderNow(chordFor(current.deg));
}

// ── Left-hand settings panel ─────────────────────────────────────────────
function buildControls() {
  $("controls").innerHTML = CONTROLS.map((c, i) => {
    const hands = handSVG(upOnly([0, 1, 2, 3, 4].slice(0, i + 1)), 46, `Left hand: ${COUNT_LABELS[i]} up`, true)
      + (i === 3 ? handSVG(upOnly([1, 2, 3, 4]), 46, "Left hand: four fingers up, thumb tucked", true) : "");
    const body = c.type === "range"
      ? `<div class="meterwrap"><div class="meter" data-key="${c.key}"><i></i><b></b></div><div class="ends"><span>▲ ${c.ends[0]}</span><span class="cval"></span><span>▼ ${c.ends[1]}</span></div></div>`
      : `<div class="opts">${c.options.map(o => `<div class="opt" data-key="${c.key}" data-v="${o.id}">${o.label}</div>`).join("")}</div>`
        + (c.twist ? `<div class="sus">${[c.twist.left, c.twist.centre, c.twist.right].map((v, j) => `<div class="opt" data-key="${c.twist.key}" data-v="${v}">${c.twist.labels[j]}</div>`).join("")}</div>` : "");
    return `<div class="ctl${i === 3 ? " wide" : ""}" id="ctl${i}"><div class="ctlhead"><div class="cname">${i + 1}: ${c.label}</div></div>${body}<div class="hint"></div><div class="hands">${hands}</div></div>`;
  }).join("");
  $("controls").querySelectorAll(".opt").forEach(el => el.onclick = () => {
    const key = el.dataset.key;
    setSetting(key, key === "sus" || key === "span" ? +el.dataset.v : el.dataset.v);
  });
  $("controls").querySelectorAll(".meter").forEach(el => {
    const c = CONTROLS.find(c => c.key === el.dataset.key);
    const set = e => { const r = el.getBoundingClientRect(); setSetting(c.key, c.max - clamp((e.clientY - r.top) / r.height, 0, 1) * (c.max - c.min)); };
    el.onpointerdown = e => { el.setPointerCapture(e.pointerId); set(e); };
    el.onpointermove = e => { if (e.buttons) set(e); };
  });
}
function renderControls() {
  ctlDirty = false;
  CONTROLS.forEach((c, i) => {
    const el = $("ctl" + i), active = !!menu && menu.i === i, v = hov(c.key);
    el.classList.toggle("active", active);
    if (c.type === "range") {
      const pct = x => (x - c.min) / (c.max - c.min) * 100;
      el.querySelector(".cval").textContent = c.fmt(v);
      el.querySelector(".meter > i").style.height = pct(v) + "%";
      el.querySelector(".meter > b").style.bottom = `calc(${pct(S[c.key])}% - 1px)`;
    } else {
      const tw = c.twist || {}, tv = tw.key && hov(tw.key);
      el.querySelectorAll(".opt").forEach(o => {
        const second = !!tw.key && o.dataset.key === tw.key, val = second ? +o.dataset.v : o.dataset.v;
        o.classList.toggle("sel", S[o.dataset.key] === val);
        o.classList.toggle("hover", active && hov(o.dataset.key) === val);
        if (second) o.classList.toggle("na", tw.key === "sus" ? !susAllowed(v, val) : !ARPS.includes(v));
      });
    }
    el.querySelector(".hint").textContent = !active ? ""
      : (c.twist ? "Tilt ▲▼ · Twist wrist ‹ › · Fist = select" : "Tilt ▲▼ · Fist = select");
  });
}

$("fingers").innerHTML = HANDS.map(h => `<div class="handname">${h === "right" ? "Right hand" : "Left hand"}</div>` + FINGERS.map((f, i) => `
  <div class="frow"><div>${f.label}</div>
  <div class="bar"><i id="b${h}${i}" style="background:${f.hex}"></i><div class="th" style="left:${ON * 100}%"></div></div>
  <div class="val" id="v${h}${i}">–</div></div>`).join("")).join("");

function onSettingsChange() {
  S.root = $("root").value; S.scale = $("scale").value;
  save(); stop(); renderChords();
}
["root", "scale"].forEach(id => $(id).onchange = onSettingsChange);

$("audioBtn").onclick = () => {
  startAudio();
  $("audioBtn").textContent = "Started"; $("audioBtn").classList.add("on");
  $("main").classList.remove("locked");
};

// Released anywhere (the cards are re-drawn when the variation changes, so don't rely on the card itself).
window.addEventListener("pointerup", () => stop("ui"));
// Keyboard audition: hold 1–8.
window.addEventListener("keydown", e => { const d = +e.key; if (actx && d >= 1 && d <= 8 && !e.repeat) play(d, "key" + d); });
window.addEventListener("keyup", e => { const d = +e.key; if (d >= 1 && d <= 8) stop("key" + d); });

setInterval(tick, 10);
setInterval(() => {
  HANDS.forEach(h => H[h].bends.forEach((b, i) => {
    $("b" + h + i).style.width = `${clamp(b, 0, 1) * 100}%`;
    const v = $("v" + h + i); v.textContent = `${Math.round(b * 100)}%`; v.classList.toggle("down", H[h].down[i]);
  }));
  if (ctlDirty) renderControls();
  const streaming = latest && performance.now() - lastMsgAt < 1500 && latest.status.startsWith("streaming");
  HANDS.forEach(h => {
    const ok = !!streaming && !!handData(h), el = $("conn" + h);
    el.classList.toggle("live", ok); el.lastElementChild.textContent = ok ? "Connected" : "Disconnected";
  });
}, 60);

// ── Canvases: audio visualiser, simulated hands; keyboard ────────────────
/** Size a canvas to its box, clear it, and return a context in CSS pixels. */
function fit(c) {
  const dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  const W = Math.round(w * dpr), Hh = Math.round(h * dpr);
  if (c.width !== W || c.height !== Hh) { c.width = W; c.height = Hh; }
  const ctx = c.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}
const ACCENT = css.getPropertyValue("--accent").trim();

// Spectrum, 40 Hz – 9 kHz on a log axis: one smooth line for the lower instrument and one for the upper.
// Each rises quickly and falls slowly.
const VIZ_N = 48;
const VIZ = [{ part: "lower", label: "Lower", color: "#2c8f5d", level: new Float32Array(VIZ_N) },
             { part: "upper", label: "Upper", color: ACCENT, level: new Float32Array(VIZ_N) }];
function drawViz() {
  const { ctx, w, h } = fit($("viz"));
  const base = h - 3, x = i => i / (VIZ_N - 1) * w;
  ctx.font = "10px system-ui"; ctx.textBaseline = "top"; ctx.lineJoin = "round";
  VIZ.forEach((v, k) => {
    const pb = partBus[v.part], lv = v.level;
    if (pb) pb.an.getByteFrequencyData(pb.bins);
    const binHz = pb ? actx.sampleRate / pb.an.fftSize : 1;
    for (let i = 0; i < VIZ_N; i++) {
      let target = 0;
      if (pb) {
        const b0 = 40 * Math.pow(225, i / VIZ_N) / binHz, b1 = 40 * Math.pow(225, (i + 1) / VIZ_N) / binHz;
        if (b1 - b0 < 1) { const b = (b0 + b1) / 2, j = Math.floor(b); target = pb.bins[j] + (pb.bins[j + 1] - pb.bins[j]) * (b - j); }
        else { for (let j = Math.ceil(b0); j < b1; j++) target = Math.max(target, pb.bins[j]); }
        target /= 255;
      }
      lv[i] += (target - lv[i]) * (target > lv[i] ? 0.3 : 0.08);
    }
    const y = i => base - lv[i] * (h - 8);
    ctx.beginPath(); ctx.moveTo(0, y(0));
    for (let i = 0; i < VIZ_N - 1; i++) ctx.quadraticCurveTo(x(i), y(i), (x(i) + x(i + 1)) / 2, (y(i) + y(i + 1)) / 2);
    ctx.lineTo(w, y(VIZ_N - 1));
    ctx.strokeStyle = v.color; ctx.lineWidth = 2; ctx.stroke();
    ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, v.color + "40"); grad.addColorStop(1, v.color + "00");
    ctx.fillStyle = grad; ctx.fill();
    ctx.fillStyle = v.color; ctx.textAlign = "right"; ctx.fillText(v.label, w - 36 * (1 - k), 0);
  });
}

// Both hands from the fingertip sensor positions (hub frame, metres: -Y along the fingers, +Z out of the
// palm), turned by the hub orientation and seen from behind and above. The heading each glove had when
// it was first seen (or at "Calibrate: open hands") counts as straight ahead.
const simState = {};
function drawSim() {
  const { ctx, w, h } = fit($("sim"));
  const scale = Math.min(w / 2 / 0.15, (h - 18) / 0.19), ct = Math.cos(0.7), st = Math.sin(0.7);
  ctx.lineCap = ctx.lineJoin = "round"; ctx.font = "11px system-ui"; ctx.textAlign = "center";
  ["left", "right"].forEach((name, k) => {
    const cx = w * (0.26 + 0.48 * k), cy = (h - 18) * 0.66;
    ctx.fillStyle = "#8b93a3"; ctx.fillText(name === "left" ? "Left" : "Right", cx, h - 4);
    const s = handData(name);
    const tips = s && FINGERS.map(f => s[f.id] && s[f.id]["TRANSFORM@hub"] && s[f.id]["TRANSFORM@hub"].slice(0, 3));
    if (!tips || tips.some(t => !t)) return;
    const S0 = simState[name] || (simState[name] = { yaw: null });
    const q = (s.hub && s.hub["ORIENTATION@LTP_NED"]) || [0, 0, 0, 1];
    if (S0.yaw == null) { const f = qrot(q, [0, -1, 0]); if (Math.hypot(f[0], f[1]) > 0.5) S0.yaw = Math.atan2(f[1], f[0]); }
    const a = -(S0.yaw || 0) / 2, Q = qmul([0, 0, Math.sin(a), Math.cos(a)], q);
    const P = p => { const v = qrot(Q, p); return [cx + v[1] * scale, cy - (v[0] * ct - v[2] * st) * scale]; };
    // As in the live view: the hub, a line out to each fingertip sensor, and a dot on each sensor.
    const hub = P([0, 0, 0]), pts = tips.map(P);
    ctx.lineWidth = 2.5;
    pts.forEach(([X, Y], i) => {
      ctx.globalAlpha = 0.55; ctx.strokeStyle = FINGERS[i].hex;
      ctx.beginPath(); ctx.moveTo(hub[0], hub[1]); ctx.lineTo(X, Y); ctx.stroke(); ctx.globalAlpha = 1;
    });
    ctx.fillStyle = "#e6e8ec"; ctx.beginPath(); ctx.arc(hub[0], hub[1], 3.5, 0, 7); ctx.fill();
    pts.forEach(([X, Y], i) => { ctx.fillStyle = FINGERS[i].hex; ctx.beginPath(); ctx.arc(X, Y, 4.5, 0, 7); ctx.fill(); });
  });
}

// Keyboard, C2 – E7: the keys sounding right now are lit.
const PIANO_LO = 36, PIANO_HI = 100;
function buildPiano() {
  let x = 0, white = "", black = "";
  for (let m = PIANO_LO; m <= PIANO_HI; m++) {
    if ([1, 3, 6, 8, 10].includes(m % 12)) black += `<rect id="key${m}" class="bk" x="${x - 3}" y="0" width="6" height="36" rx="1"/>`;
    else { white += `<rect id="key${m}" class="wk" x="${x + 0.5}" y="0" width="9" height="58" rx="1.5"/>`; x += 10; }
  }
  $("piano").innerHTML = `<svg viewBox="0 0 ${x} 58" preserveAspectRatio="none" role="img" aria-label="Keys being played">${white}${black}</svg>`;
}
let keysOn = new Set();
function drawPiano() {
  const on = new Set();
  if (current && actx && actx.state === "running") {
    const now = actx.currentTime;
    for (let i = sounding.length - 1; i >= 0; i--) {
      const n = sounding[i];
      if (n.t1 <= now) sounding.splice(i, 1); else if (n.t0 <= now) on.add(n.m);
    }
  } else if (current) {                 // audio not started: show the chord itself
    const inst = INSTRUMENTS.find(i => i.id === eff("instrument"));
    [...lowerNotes(current.ch), ...upperNotes(current.ch, inst.upper)].forEach(m => on.add(m));
  }
  for (const m of keysOn) if (!on.has(m)) { const el = $("key" + m); if (el) el.classList.remove("on"); }
  for (const m of on) if (!keysOn.has(m)) { const el = $("key" + m); if (el) el.classList.add("on"); }
  keysOn = on;
}
(function frame() { requestAnimationFrame(frame); drawViz(); drawSim(); drawPiano(); })();

// The right-hand box takes the spare height, but never grows taller than the left-hand box.
new ResizeObserver(() => { $("rhBox").style.maxHeight = $("lhBox").offsetHeight + "px"; }).observe($("lhBox"));

buildControls(); buildPiano(); renderChords(); renderNow(null);
</script>
</body>
